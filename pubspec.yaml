name: jpeg2000
description: >-
  Pure Dart JPEG 2000 codec: decodes JP2 and J2K to 8-bit pixels with alpha,
  encodes PGM/PPM losslessly or by rate, and runs on the VM, dart2js and
  dart2wasm.
version: 0.9.0
repository: https://github.com/insinfo/jpeg2000
issue_tracker: https://github.com/insinfo/jpeg2000/issues
topics:
  - jpeg2000
  - jp2
  - image
  - codec
  - decoder

environment:
  sdk: ^3.6.0

dependencies:
  # Annotations only; no runtime code.
  meta: ^1.3.0
  # Browser interop for `decodeJpeg2000Source` with Blob/File inputs. Only
  # reached behind `if (dart.library.js_interop)`, so VM builds never load it.
  web: ^1.1.1

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.0

executables:
  jp2dec: decode
  jp2enc: encode
